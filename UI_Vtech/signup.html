<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <title>DASHMIN - Bootstrap Admin Template</title>
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <meta content="" name="keywords">
    <meta content="" name="description">

    <!-- Favicon -->
    <link href="img/favicon.ico" rel="icon">

    <!-- Google Web Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Icon Font Stylesheet -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.10.0/css/all.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.4.1/font/bootstrap-icons.css" rel="stylesheet">

    <!-- Libraries Stylesheet -->
    <link href="lib/owlcarousel/assets/owl.carousel.min.css" rel="stylesheet">
    <link href="lib/tempusdominus/css/tempusdominus-bootstrap-4.min.css" rel="stylesheet" />

    <!-- Customized Bootstrap Stylesheet -->
    <link href="css/bootstrap.min.css" rel="stylesheet">

    <!-- Template Stylesheet -->
    <link href="css/style.css" rel="stylesheet">

    <style>
        .form-container {
    background: #fff;
    border-radius: 1rem;
    box-shadow: 0 0 30px rgba(250, 2, 2, 0.1);
    overflow: hidden;
  }
  .container{
      max-width: 880px;
  }
  .login-image {
      display: flex;
      align-items: center;
      justify-content: center;
      background-color: #f8f9fa;
      padding: 2rem;
    }
  
    .logo-img {
      max-width: 100%;
      max-height: 387px;
      object-fit: contain;
    }

    .container input{
        border: none;
        border-bottom:1px solid #030303 ;
    }

    #remember{
        border: 0.5px solid #483636;
    }
  
    @media (max-width: 576px) {
      .login-image {
        display: none !important;
      } 
    }
    </style>
</head>

<body>
    <div class="container-fluid ">
        <!-- Spinner Start -->
        <div id="spinner" class="show bg-white position-fixed translate-middle w-100 vh-100 top-50 start-50 d-flex align-items-center justify-content-center">
            <div class="spinner-border text-primary" style="width: 3rem; height: 3rem;" role="status">
                <span class="sr-only">Loading...</span>
            </div>
        </div>
        <!-- Spinner End -->


        <!-- Sign Up Start -->
        <div class="container py-5">
        <div class="row form-container">
            <div class="col-md-6 login-image d-flex flex-column align-items-center justify-content-center text-center">
                <div id="roleBox" class="mb-4">
                  <h3 class="fw-bold">Welcome back</h3>
                  <span id="userRole" class="fs-5 text-primary"></span>
                </div>
                <a href="Dashboard.html">
                  <img src="img/Logo.png" alt="SmartGarage Logo" class="img-fluid logo-img" style="max-width: 300px;">
                </a>
              </div>
              
            <div class="col-md-6 p-4 p-md-5">
                <h2 class="mb-4 fw-bold text-center text-md-start">Sign up</h2>
                <form id="loginForm" novalidate>
                    <div class="mb-3">
                      <label class="form-label"><i class="fa fa-user me-2"></i>Your Name</label>
                      <input type="text" class="form-control" id="username" placeholder="Enter your name">
                      <div class="invalid-feedback">Username is required and must be a string.</div>
                    </div>
                  
                    <div class="mb-3">
                      <label class="form-label"><i class="fa fa-lock me-2"></i>Password</label>
                      <input type="password" class="form-control" id="password" placeholder="Enter password">
                      <div class="invalid-feedback">Password must contain both letters and numbers.</div>
                    </div>
                  
                    <div class="form-check mb-3">
                      <input type="checkbox" class="form-check-input" id="remember">
                      <label class="form-check-label" for="remember">Remember me</label>
                    </div>
                  
                    <button href="" type="submit" class="btn btn-primary w-100 mb-3">Log in</button>
                    <div class="text-center">
                        
                        <p class="mt-3 mb-1">Or login with</p>
                        <div class="d-flex justify-content-center gap-2">
                            <a href="../UI_Users/index.html" class="btn btn-outline-danger"><i class="fab fa-google"></i></a>
                        </div>
                    </div>
                </form>
            </div>
        </div>
    </div>
        <!-- Sign Up End -->
    </div>

    <!-- JavaScript Libraries -->
    <script src="https://code.jquery.com/jquery-3.4.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="lib/chart/chart.min.js"></script>
    <script src="lib/easing/easing.min.js"></script>
    <script src="lib/waypoints/waypoints.min.js"></script>
    <script src="lib/owlcarousel/owl.carousel.min.js"></script>
    <script src="lib/tempusdominus/js/moment.min.js"></script>
    <script src="lib/tempusdominus/js/moment-timezone.min.js"></script>
    <script src="lib/tempusdominus/js/tempusdominus-bootstrap-4.min.js"></script>

    <!-- Template Javascript -->
    <script src="js/main.js"></script>
</body>

</html>
